<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop – Montag Kollektiv</title>
  <meta name="description" content="Montag Kollektiv Shop – coming soon." />
  <link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="flex h-dvh flex-col overflow-hidden bg-white text-brand font-sans antialiased">

  <!-- ───────── Kopfzeile (Shop-Variante: schmale linke Zelle) ───────── -->
  <header class="grid grid-cols-[auto_1fr] border border-brand max-md:border-x-0 max-md:border-t-0 text-display">
    <a href="index.html" class="border-r border-brand px-[1.2vw] py-[1.1vw] max-md:px-4 max-md:py-3 bold-stable hover:font-bold" data-text="Montag Kollektiv">Montag Kollektiv</a>
    <a href="shop.html" class="px-[0.6vw] py-[1.1vw] max-md:px-4 max-md:py-3 text-right font-bold">shop</a>
  </header>

  <main id="board" class="relative flex-1 overflow-hidden">

    <!--
      Sticker: Position und Drehung über die CSS-Variablen im style-Attribut
      --x / --y = Mittelpunkt in % der Fläche, --r = Drehung
    -->
    <span class="sticker" style="--x:19%; --y:28%; --r:-18deg">KEYCHAINS</span>
    <span class="sticker" style="--x:78.7%; --y:30%; --r:30deg">STICKERS</span>
    <span class="sticker" style="--x:79.6%; --y:80%; --r:0deg">STAR BAGS</span>

    <p class="absolute left-1/2 top-1/2 -translate-1/2 text-center font-serif text-display leading-[1.06]">
      <span class="box-decoration-clone bg-brand px-[0.4em] py-[0.04em] text-white">COMING<br />SOON</span>
    </p>

    <!-- Wunsch-Feld: Nach dem Absenden wird der Wunsch zum Sticker, den man irgendwo ablegen kann -->
    <form id="wish-form" class="absolute bottom-[1.2vw] left-[1.2vw] flex gap-[0.65vw] max-md:inset-x-4 max-md:bottom-12" autocomplete="off">
      <label for="wish" class="sr-only">Something you wish for?</label>
      <input id="wish" name="wish" type="text" maxlength="40" required
        placeholder="something you wish for?"
        class="h-[3.5vw] min-h-12 w-[30.9vw] min-w-0 border border-muted bg-neutral-100 px-[1vw] text-input outline-none placeholder:text-muted focus:border-brand focus:bg-white [&:not(:placeholder-shown)]:border-brand [&:not(:placeholder-shown)]:bg-white max-md:flex-1" />
      <button type="submit" aria-label="Send wish"
        class="grid aspect-square h-[3.5vw] min-h-12 cursor-pointer place-items-center bg-brand text-white hover:bg-neutral-800">
        <svg viewBox="0 0 24 24" class="w-1/2" fill="currentColor" aria-hidden="true"><path d="M2 3l20 9-20 9 4-9z" /></svg>
      </button>
    </form>

    <p id="wish-hint" class="absolute bottom-[4.9vw] left-[1.2vw] hidden text-names text-muted max-md:bottom-20 max-md:left-4">drop it somewhere</p>

  </main>

  <nav class="fixed right-[1.2vw] bottom-[0.8vw] z-40 flex gap-[1.2vw] text-names text-muted max-md:right-4 max-md:bottom-3 max-md:gap-3" aria-label="Rechtliches"><a href="datenschutz.html" class="hover:text-brand">datenschutz</a><a href="impressum.html" class="hover:text-brand">impressum</a></nav>

  <script src="js/shop.js"></script>
  <script src="js/brush.js"></script>
  <script src="js/shop-drawing.js"></script>
  <!-- Falter vorübergehend aus. Zum Wiedereinschalten diese Zeile wieder aktivieren:
  <script src="js/butterflies.js"></script> -->
</body>
</html>
