<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montag – Shop</title>
  <meta name="description" content="Montag Shop" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-paper text-brand font-sans antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-paper/90 backdrop-blur border-b border-black/10">
    <nav class="mx-auto max-w-6xl flex items-center justify-between px-6 py-4">
      <a href="index.html" class="text-xl font-bold tracking-tight">Montag</a>
      <ul class="flex gap-6 text-sm font-medium">
        <li><a href="index.html" class="hover:underline underline-offset-4">Home</a></li>
        <li><a href="shop.html" class="underline underline-offset-4">Shop</a></li>
      </ul>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-16">
    <h1 class="text-4xl md:text-5xl font-bold tracking-tight">Shop</h1>
    <p class="mt-4 text-neutral-700 max-w-xl">Kurzer Text zum Shop – hier kommt dein Text aus Figma hin.</p>

    <!-- Produkte: Bilder als images/shop/produkt-1.jpg usw. ablegen.
         Für ein neues Produkt einfach einen <article>-Block kopieren. -->
    <div class="mt-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

      <article class="group">
        <div class="aspect-[3/4] rounded-xl overflow-hidden">
          <img src="images/shop/produkt-1.jpg" alt="Produkt 1" class="img-slot group-hover:scale-105 transition duration-500" />
        </div>
        <div class="mt-4 flex justify-between items-start">
          <h2 class="font-semibold">Produkt 1</h2>
          <p class="font-medium">29 €</p>
        </div>
        <a href="#" class="mt-3 inline-block rounded-full border border-brand px-5 py-2 text-sm font-semibold hover:bg-brand hover:text-white transition">Kaufen</a>
      </article>

      <article class="group">
        <div class="aspect-[3/4] rounded-xl overflow-hidden">
          <img src="images/shop/produkt-2.jpg" alt="Produkt 2" class="img-slot group-hover:scale-105 transition duration-500" />
        </div>
        <div class="mt-4 flex justify-between items-start">
          <h2 class="font-semibold">Produkt 2</h2>
          <p class="font-medium">39 €</p>
        </div>
        <a href="#" class="mt-3 inline-block rounded-full border border-brand px-5 py-2 text-sm font-semibold hover:bg-brand hover:text-white transition">Kaufen</a>
      </article>

      <article class="group">
        <div class="aspect-[3/4] rounded-xl overflow-hidden">
          <img src="images/shop/produkt-3.jpg" alt="Produkt 3" class="img-slot group-hover:scale-105 transition duration-500" />
        </div>
        <div class="mt-4 flex justify-between items-start">
          <h2 class="font-semibold">Produkt 3</h2>
          <p class="font-medium">49 €</p>
        </div>
        <a href="#" class="mt-3 inline-block rounded-full border border-brand px-5 py-2 text-sm font-semibold hover:bg-brand hover:text-white transition">Kaufen</a>
      </article>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-black/10">
    <div class="mx-auto max-w-6xl px-6 py-10 flex flex-col md:flex-row justify-between gap-4 text-sm text-neutral-600">
      <p>© 2026 Montag</p>
      <div class="flex gap-6">
        <a href="#" class="hover:text-brand">Impressum</a>
        <a href="#" class="hover:text-brand">Datenschutz</a>
      </div>
    </div>
  </footer>

</body>
</html>
